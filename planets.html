<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>APLANUS | Εξερευνητής Πλανητών & Δορυφόρων</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070913">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: rgba(16, 23, 42, 0.72);
      --card-border: rgba(99, 102, 241, 0.22);
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .container {
      max-width: 1000px;
      width: 100%;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .btn-back {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: var(--accent-cyan);
      padding: 8px 16px;
      border-radius: 12px;
      font-family: 'Orbitron', monospace;
      font-size: 0.8rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 900;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 35%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .planets-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .planet-item {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 22px;
      cursor: pointer;
      transition: all 0.25s ease;
      overflow: hidden;
    }

    .planet-item:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    .planet-main-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .planet-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .planet-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(255,255,255,0.15);
    }

    .planet-meta h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      color: #fff;
      margin-bottom: 4px;
    }

    .planet-meta p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .moons-badge {
      font-family: 'Orbitron', monospace;
      font-size: 0.78rem;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent-cyan);
      white-space: nowrap;
    }

    /* Αναπτυσσόμενη Λίστα Δορυφόρων */
    .moons-dropdown {
      display: none;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      animation: fadeIn 0.3s ease forwards;
    }

    .moons-dropdown.open {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .moons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .moon-card {
      background: rgba(10, 15, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .moon-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #1e293b;
    }

    .moon-info h4 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.88rem;
      color: #fff;
    }

    .moon-info span {
      font-size: 0.72rem;
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-nav">
      <a href="index.html" class="btn-back">⬅ Επιστροφή</a>
    </div>

    <h1>Ουράνια Σώματα & Δορυφόροι</h1>
    <p class="subtitle">Πατήστε σε οποιονδήποτε πλανήτη για να δείτε τους κύριους δορυφόρους του.</p>

    <div class="planets-list" id="planetsList"></div>
  </div>

  <script>
    const PLANET_DATA = [
      {
        name: "Ερμής (Mercury)",
        type: "Βραχώδης Πλανήτης",
        distSun: "57.9 εκ. χλμ",
        color: "radial-gradient(circle at 35% 35%, #e2e8f0, #94a3b8, #475569)",
        moonsCount: 0,
        moons: []
      },
      {
        name: "Αφροδίτη (Venus)",
        type: "Βραχώδης Πλανήτης",
        distSun: "108.2 εκ. χλμ",
        color: "radial-gradient(circle at 35% 35%, #fef08a, #f59e0b, #b45309)",
        moonsCount: 0,
        moons: []
      },
      {
        name: "Γη (Earth)",
        type: "Βραχώδης Πλανήτης",
        distSun: "149.6 εκ. χλμ",
        color: "radial-gradient(circle at 35% 35%, #67e8f9, #0284c7, #1e3a8a)",
        moonsCount: 1,
        moons: [
          { name: "Σελήνη (Moon)", desc: "Διάμετρος: 3.474 χλμ", img: "https://images-assets.nasa.gov/image/PIA00405/PIA00405~orig.jpg" }
        ]
      },
      {
        name: "Άρης (Mars)",
        type: "Βραχώδης Πλανήτης",
        distSun: "227.9 εκ. χλμ",
        color: "radial-gradient(circle at 35% 35%, #fca5a5, #ef4444, #991b1b)",
        moonsCount: 2,
        moons: [
          { name: "Φόβος (Phobos)", desc: "Μέγεθος: 22 χλμ", img: "https://images-assets.nasa.gov/image/PIA10368/PIA10368~orig.jpg" },
          { name: "Δείμος (Deimos)", desc: "Μέγεθος: 12 χλμ", img: "https://images-assets.nasa.gov/image/PIA11826/PIA11826~orig.jpg" }
        ]
      },
      {
        name: "Δήμητρα (1 Ceres)",
        type: "Νάνος Πλανήτης (Ζώνη Αστεροειδών)",
        distSun: "413.7 εκ. χλμ",
        color: "radial-gradient(circle at 35% 35%, #e9d5ff, #c084fc, #6b21a8)",
        moonsCount: 0,
        moons: []
      },
      {
        name: "Δίας (Jupiter)",
        type: "Αέριος Γίγαντας",
        distSun: "778.5 εκ. χλμ",
        color: "radial-gradient(circle at 35% 35%, #fed7aa, #f97316, #9a3412)",
        moonsCount: 95,
        moons: [
          { name: "Γανυμήδης (Ganymede)", desc: "Μεγαλύτερος δορυφόρος (5.268 χλμ)", img: "https://images-assets.nasa.gov/image/PIA00716/PIA00716~orig.jpg" },
          { name: "Καλλιστώ (Callisto)", desc: "Διάμετρος: 4.820 χλμ", img: "https://images-assets.nasa.gov/image/PIA03456/PIA03456~orig.jpg" },
          { name: "Ιώ (Io)", desc: "Ηφαιστειογενής (3.642 χλμ)", img: "https://images-assets.nasa.gov/image/PIA02308/PIA02308~orig.jpg" },
          { name: "Ευρώπη (Europa)", desc: "Υποθαλάσσιος ωκεανός (3.121 χλμ)", img: "https://images-assets.nasa.gov/image/PIA00502/PIA00502~orig.jpg" }
        ]
      },
      {
        name: "Κρόνος (Saturn)",
        type: "Αέριος Γίγαντας με Δακτυλίους",
        distSun: "1.43 δις χλμ",
        color: "radial-gradient(circle at 35% 35%, #fef08a, #eab308, #854d0e)",
        moonsCount: 146,
        moons: [
          { name: "Τιτάνας (Titan)", desc: "Πυκνή ατμόσφαιρα (5.149 χλμ)", img: "https://images-assets.nasa.gov/image/PIA02145/PIA02145~orig.jpg" },
          { name: "Εγκέλαδος (Enceladus)", desc: "Πίδακες πάγου (504 χλμ)", img: "https://images-assets.nasa.gov/image/PIA08329/PIA08329~orig.jpg" },
          { name: "Ρέα (Rhea)", desc: "Διάμετρος: 1.527 χλμ", img: "https://images-assets.nasa.gov/image/PIA07763/PIA07763~orig.jpg" },
          { name: "Ιαπετός (Iapetus)", desc: "Δίχρωμος δορυφόρος (1.470 χλμ)", img: "https://images-assets.nasa.gov/image/PIA08384/PIA08384~orig.jpg" }
        ]
      },
      {
        name: "Ουρανός (Uranus)",
        type: "Γίγαντας Πάγου",
        distSun: "2.87 δις χλμ",
        color: "radial-gradient(circle at 35% 35%, #a5f3fc, #06b6d4, #164e63)",
        moonsCount: 28,
        moons: [
          { name: "Τιτάνια (Titania)", desc: "Διάμετρος: 1.578 χλμ", img: "https://images-assets.nasa.gov/image/PIA00036/PIA00036~orig.jpg" },
          { name: "Όμπερον (Oberon)", desc: "Διάμετρος: 1.523 χλμ", img: "https://images-assets.nasa.gov/image/PIA00034/PIA00034~orig.jpg" },
          { name: "Άριελ (Ariel)", desc: "Διάμετρος: 1.158 χλμ", img: "https://images-assets.nasa.gov/image/PIA00041/PIA00041~orig.jpg" },
          { name: "Μιράντα (Miranda)", desc: "Χαράδρες πάγου (471 χλμ)", img: "https://images-assets.nasa.gov/image/PIA01354/PIA01354~orig.jpg" }
        ]
      },
      {
        name: "Ποσειδώνας (Neptune)",
        type: "Γίγαντας Πάγου",
        distSun: "4.50 δις χλμ",
        color: "radial-gradient(circle at 35% 35%, #93c5fd, #2563eb, #1e3a8a)",
        moonsCount: 16,
        moons: [
          { name: "Τρίτωνας (Triton)", desc: "Ανάδρομη τροχιά (2.706 χλμ)", img: "https://images-assets.nasa.gov/image/PIA01537/PIA01537~orig.jpg" },
          { name: "Πρωτέας (Proteus)", desc: "Διάμετρος: 420 χλμ", img: "https://images-assets.nasa.gov/image/PIA00057/PIA00057~orig.jpg" }
        ]
      },
      {
        name: "Πλούτωνας (Pluto)",
        type: "Νάνος Πλανήτης (Ζώνη Kuiper)",
        distSun: "5.91 δις χλμ",
        color: "radial-gradient(circle at 35% 35%, #ddd6fe, #8b5cf6, #4c1d95)",
        moonsCount: 5,
        moons: [
          { name: "Χάρων (Charon)", desc: "Διάμετρος: 1.212 χλμ (Διπλό σύστημα)", img: "https://images-assets.nasa.gov/image/PIA19966/PIA19966~orig.jpg" },
          { name: "Νύχτα (Nix)", desc: "Μέγεθος: 49 χλμ", img: "https://images-assets.nasa.gov/image/PIA19859/PIA19859~orig.jpg" },
          { name: "Ύδρα (Hydra)", desc: "Μέγεθος: 50 χλμ", img: "https://images-assets.nasa.gov/image/PIA19858/PIA19858~orig.jpg" }
        ]
      }
    ];

    const listEl = document.getElementById('planetsList');

    PLANET_DATA.forEach((p, idx) => {
      const card = document.createElement('div');
      card.className = 'planet-item';

      let moonsHtml = '';
      if (p.moons.length > 0) {
        moonsHtml = `
          <div class="moons-dropdown" id="dropdown-${idx}">
            <div style="font-size: 0.8rem; color: #38bdf8; font-family: 'Orbitron'; margin-bottom: 6px;">Κυριοι Δορυφοροι:</div>
            <div class="moons-grid">
              ${p.moons.map(m => `
                <div class="moon-card">
                  <img src="${m.img}" alt="${m.name}" class="moon-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'42\\' height=\\'42\\'><circle cx=\\'21\\' cy=\\'21\\' r=\\'20\\' fill=\\'%2364748b\\'/></svg>'">
                  <div class="moon-info">
                    <h4>${m.name}</h4>
                    <span>${m.desc}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else {
        moonsHtml = `
          <div class="moons-dropdown" id="dropdown-${idx}">
            <p style="font-size: 0.82rem; color: var(--text-muted); padding: 6px 0;">Δεν διαθέτει φυσικούς δορυφόρους.</p>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="planet-main-row">
          <div class="planet-left">
            <div class="planet-avatar" style="background: ${p.color};"></div>
            <div class="planet-meta">
              <h3>${p.name}</h3>
              <p>${p.type} • Απόσταση: ${p.distSun}</p>
            </div>
          </div>
          <div class="moons-badge">
            ${p.moonsCount} ${p.moonsCount === 1 ? 'Δορυφόρος' : 'Δορυφόροι'}
          </div>
        </div>
        ${moonsHtml}
      `;

      card.addEventListener('click', () => {
        const drop = document.getElementById(`dropdown-${idx}`);
        drop.classList.toggle('open');
      });

      listEl.appendChild(card);
    });
  </script>
</body>
</html>
