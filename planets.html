<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>APLANUS | Εξερευνητής Πλανητών & Δορυφόρων</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070913">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: rgba(16, 23, 42, 0.75);
      --card-border: rgba(99, 102, 241, 0.22);
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
      --accent-gold: #f59e0b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .container {
      max-width: 960px;
      width: 100%;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .btn-back {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: var(--accent-cyan);
      padding: 8px 16px;
      border-radius: 12px;
      font-family: 'Orbitron', monospace;
      font-size: 0.8rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-back:hover {
      background: rgba(56, 189, 248, 0.3);
      color: #fff;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 900;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 35%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .planets-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .planet-item {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 20px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .planet-item:hover {
      border-color: var(--accent-cyan);
    }

    .planet-main-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .planet-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .planet-avatar-img {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #1e293b;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
    }

    .planet-meta h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 4px;
    }

    .planet-meta p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .moons-badge {
      font-family: 'Orbitron', monospace;
      font-size: 0.78rem;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent-cyan);
      white-space: nowrap;
    }

    .moons-dropdown {
      display: none;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      animation: fadeIn 0.25s ease forwards;
    }

    .moons-dropdown.open {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .scroll-container {
      max-height: 270px;
      overflow-y: auto;
      padding-right: 6px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .scroll-container::-webkit-scrollbar {
      width: 5px;
    }
    .scroll-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
    }
    .scroll-container::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.35);
      border-radius: 4px;
    }

    .moon-card {
      background: rgba(10, 15, 30, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .moon-card:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .moon-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .moon-info h4 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: #fff;
    }

    .moon-info span {
      font-size: 0.73rem;
      color: var(--accent-cyan);
    }

    #imageModal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 7, 18, 0.92);
      backdrop-filter: blur(16px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    #imageModal.active {
      display: flex;
    }

    .modal-box {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent-cyan);
      border-radius: 20px;
      padding: 22px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      animation: modalPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modalPop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-preview-img {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 16px auto;
      display: block;
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      color: #fff;
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .btn-close-modal {
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid var(--accent-cyan);
      color: #fff;
      padding: 8px 24px;
      border-radius: 12px;
      font-family: 'Orbitron', monospace;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-nav">
      <a href="index.html" class="btn-back">⬅ Επιστροφή</a>
    </div>

    <h1>Ουράνια Σώματα & Δορυφόροι</h1>
    <p class="subtitle">
      Ταξινομημένα κατά πλήθος δορυφόρων.<br/>
      Πατήστε σε κάθε πλανήτη για να δείτε τους δορυφόρους και επιλέξτε έναν για μεγέθυνση.
    </p>

    <div class="planets-list" id="planetsList"></div>
  </div>

  <div id="imageModal">
    <div class="modal-box">
      <img id="modalImg" class="modal-preview-img" src="" alt="Zoom" />
      <h3 id="modalTitle" class="modal-title">--</h3>
      <p id="modalDesc" class="modal-desc">--</p>
      <button type="button" class="btn-close-modal" id="btnCloseModal">Κλείσιμο</button>
    </div>
  </div>

  <script>
    const PLANET_DATA = [
      {
        name: "Κρόνος (Saturn)",
        type: "Αέριος Γίγαντας με Δακτυλίους",
        distSun: "1.43 δις χλμ",
        img: "https://images-assets.nasa.gov/image/PIA14922/PIA14922~orig.jpg",
        moonsCount: 146,
        moons: [
          { name: "Τιτάνας (Titan)", desc: "Πυκνή ατμόσφαιρα (5.149 χλμ)", img: "https://images-assets.nasa.gov/image/PIA02145/PIA02145~orig.jpg" },
          { name: "Εγκέλαδος (Enceladus)", desc: "Πίδακες πάγου & ωκεανός (504 χλμ)", img: "https://images-assets.nasa.gov/image/PIA08329/PIA08329~orig.jpg" },
          { name: "Ρέα (Rhea)", desc: "Διάμετρος: 1.527 χλμ", img: "https://images-assets.nasa.gov/image/PIA07763/PIA07763~orig.jpg" },
          { name: "Ιαπετός (Iapetus)", desc: "Δίχρωμη επιφάνεια (1.470 χλμ)", img: "https://images-assets.nasa.gov/image/PIA08384/PIA08384~orig.jpg" },
          { name: "Διώνη (Dione)", desc: "Παγωμένη επιφάνεια (1.122 χλμ)", img: "https://images-assets.nasa.gov/image/PIA08183/PIA08183~orig.jpg" },
          { name: "Τηθύς (Tethys)", desc: "Τεράστιος κρατήρας Οδυσσέας (1.062 χλμ)", img: "https://images-assets.nasa.gov/image/PIA07738/PIA07738~orig.jpg" },
          { name: "Μίμας (Mimas)", desc: "Ο δορυφόρος Death Star (396 χλμ)", img: "https://images-assets.nasa.gov/image/PIA12570/PIA12570~orig.jpg" },
          { name: "Υπερίων (Hyperion)", desc: "Σπογγώδης μορφή (270 χλμ)", img: "https://images-assets.nasa.gov/image/PIA07740/PIA07740~orig.jpg" }
        ]
      },
      {
        name: "Δίας (Jupiter)",
        type: "Αέριος Γίγαντας",
        distSun: "778.5 εκ. χλμ",
        img: "https://images-assets.nasa.gov/image/PIA02873/PIA02873~orig.jpg",
        moonsCount: 95,
        moons: [
          { name: "Γανυμήδης (Ganymede)", desc: "Ο μεγαλύτερος δορυφόρος (5.268 χλμ)", img: "https://images-assets.nasa.gov/image/PIA00716/PIA00716~orig.jpg" },
          { name: "Καλλιστώ (Callisto)", desc: "Πανάρχαια κρατηρογενής επιφάνεια (4.820 χλμ)", img: "https://images-assets.nasa.gov/image/PIA03456/PIA03456~orig.jpg" },
          { name: "Ιώ (Io)", desc: "Ο πιο ηφαιστειογενής κόσμος (3.642 χλμ)", img: "https://images-assets.nasa.gov/image/PIA02308/PIA02308~orig.jpg" },
          { name: "Ευρώπη (Europa)", desc: "Παγκόσμιος υπόγειος ωκεανός (3.121 χλμ)", img: "https://images-assets.nasa.gov/image/PIA00502/PIA00502~orig.jpg" },
          { name: "Αμάλθεια (Amalthea)", desc: "Ακανόνιστος κοκκινωπός (167 χλμ)", img: "https://images-assets.nasa.gov/image/PIA01077/PIA01077~orig.jpg" },
          { name: "Ιμαλία (Himalia)", desc: "Εξωτερικός δορυφόρος (140 χλμ)", img: "https://images-assets.nasa.gov/image/PIA02875/PIA02875~orig.jpg" }
        ]
      },
      {
        name: "Ουρανός (Uranus)",
        type: "Γίγαντας Πάγου",
        distSun: "2.87 δις χλμ",
        img: "https://images-assets.nasa.gov/image/PIA18182/PIA18182~orig.jpg",
        moonsCount: 28,
        moons: [
          { name: "Τιτάνια (Titania)", desc: "Μεγαλύτερος δορυφόρος Ουρανού (1.578 χλμ)", img: "https://images-assets.nasa.gov/image/PIA00036/PIA00036~orig.jpg" },
          { name: "Όμπερον (Oberon)", desc: "Παλαιός κρατηρογενής (1.523 χλμ)", img: "https://images-assets.nasa.gov/image/PIA00034/PIA00034~orig.jpg" },
          { name: "Άριελ (Ariel)", desc: "Φωτεινότερη επιφάνεια (1.158 χλμ)", img: "https://images-assets.nasa.gov/image/PIA00041/PIA00041~orig.jpg" },
          { name: "Ουμβριήλ (Umbriel)", desc: "Σκοτεινή επιφάνεια (1.169 χλμ)", img: "https://images-assets.nasa.gov/image/PIA00040/PIA00040~orig.jpg" },
          { name: "Μιράντα (Miranda)", desc: "Ακραία γεωλογικά ρήγματα (471 χλμ)", img: "https://images-assets.nasa.gov/image/PIA01354/PIA01354~orig.jpg" }
        ]
      },
      {
        name: "Ποσειδώνας (Neptune)",
        type: "Γίγαντας Πάγου",
        distSun: "4.50 δις χλμ",
        img: "https://images-assets.nasa.gov/image/PIA01492/PIA01492~orig.jpg",
        moonsCount: 16,
        moons: [
          { name: "Τρίτωνας (Triton)", desc: "Ανάδρομη τροχιά με κρυοηφαίστεια (2.706 χλμ)", img: "https://images-assets.nasa.gov/image/PIA01537/PIA01537~orig.jpg" },
          { name: "Πρωτέας (Proteus)", desc: "Σκούρος ακανόνιστος (420 χλμ)", img: "https://images-assets.nasa.gov/image/PIA00057/PIA00057~orig.jpg" },
          { name: "Νηρηίδα (Nereid)", desc: "Εξαιρετικά εκκεντρική τροχιά (340 χλμ)", img: "https://images-assets.nasa.gov/image/PIA00055/PIA00055~orig.jpg" },
          { name: "Λάρισσα (Larissa)", desc: "Εσωτερικός δορυφόρος (194 χλμ)", img: "https://images-assets.nasa.gov/image/PIA00054/PIA00054~orig.jpg" }
        ]
      },
      {
        name: "Πλούτωνας (Pluto)",
        type: "Νάνος Πλανήτης (Ζώνη Kuiper)",
        distSun: "5.91 δις χλμ",
        img: "https://images-assets.nasa.gov/image/PIA19952/PIA19952~orig.jpg",
        moonsCount: 5,
        moons: [
          { name: "Χάρων (Charon)", desc: "Διάμετρος: 1.212 χλμ (Διπλό πλανητικό σύστημα)", img: "https://images-assets.nasa.gov/image/PIA19966/PIA19966~orig.jpg" },
          { name: "Νύχτα (Nix)", desc: "Μέγεθος: 49 χλμ", img: "https://images-assets.nasa.gov/image/PIA19859/PIA19859~orig.jpg" },
          { name: "Ύδρα (Hydra)", desc: "Μέγεθος: 50 χλμ", img: "https://images-assets.nasa.gov/image/PIA19858/PIA19858~orig.jpg" },
          { name: "Κέρβερος (Kerberos)", desc: "Μέγεθος: 19 χλμ", img: "https://images-assets.nasa.gov/image/PIA20042/PIA20042~orig.jpg" },
          { name: "Στύγα (Styx)", desc: "Μέγεθος: 16 χλμ", img: "https://images-assets.nasa.gov/image/PIA19968/PIA19968~orig.jpg" }
        ]
      },
      {
        name: "Άρης (Mars)",
        type: "Βραχώδης Πλανήτης",
        distSun: "227.9 εκ. χλμ",
        img: "https://images-assets.nasa.gov/image/PIA04304/PIA04304~orig.jpg",
        moonsCount: 2,
        moons: [
          { name: "Φόβος (Phobos)", desc: "Μέγεθος: 22 χλμ", img: "https://images-assets.nasa.gov/image/PIA10368/PIA10368~orig.jpg" },
          { name: "Δείμος (Deimos)", desc: "Μέγεθος: 12 χλμ", img: "https://images-assets.nasa.gov/image/PIA11826/PIA11826~orig.jpg" }
        ]
      },
      {
        name: "Γη (Earth)",
        type: "Βραχώδης Πλανήτης",
        distSun: "149.6 εκ. χλμ",
        img: "https://images-assets.nasa.gov/image/PIA18033/PIA18033~orig.jpg",
        moonsCount: 1,
        moons: [
          { name: "Σελήνη (Moon)", desc: "Διάμετρος: 3.474 χλμ", img: "https://images-assets.nasa.gov/image/PIA00405/PIA00405~orig.jpg" }
        ]
      },
      {
        name: "Ερμής (Mercury)",
        type: "Βραχώδης Πλανήτης",
        distSun: "57.9 εκ. χλμ",
        img: "https://images-assets.nasa.gov/image/PIA11364/PIA11364~orig.jpg",
        moonsCount: 0,
        moons: []
      },
      {
        name: "Αφροδίτη (Venus)",
        type: "Βραχώδης Πλανήτης",
        distSun: "108.2 εκ. χλμ",
        img: "https://images-assets.nasa.gov/image/PIA00271/PIA00271~orig.jpg",
        moonsCount: 0,
        moons: []
      },
      {
        name: "Δήμητρα (1 Ceres)",
        type: "Νάνος Πλανήτης (Ζώνη Αστεροειδών)",
        distSun: "413.7 εκ. χλμ",
        img: "https://images-assets.nasa.gov/image/PIA19562/PIA19562~orig.jpg",
        moonsCount: 0,
        moons: []
      }
    ];

    PLANET_DATA.sort((a, b) => b.moonsCount - a.moonsCount);

    const listEl = document.getElementById('planetsList');
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const btnCloseModal = document.getElementById('btnCloseModal');

    function openImagePreview(name, desc, imgSrc) {
      modalImg.src = imgSrc;
      modalTitle.textContent = name;
      modalDesc.textContent = desc;
      modal.classList.add('active');
    }

    btnCloseModal.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    PLANET_DATA.forEach((p, idx) => {
      const card = document.createElement('div');
      card.className = 'planet-item';

      let moonsHtml = '';
      if (p.moons.length > 0) {
        moonsHtml = `
          <div class="moons-dropdown" id="dropdown-${idx}">
            <div style="font-size: 0.78rem; color: var(--accent-cyan); font-family: 'Orbitron'; margin-bottom: 8px;">
              Δορυφόροι (Scroll για προβολή όλων):
            </div>
            <div class="scroll-container">
              ${p.moons.map(m => `
                <div class="moon-card" onclick="event.stopPropagation(); openImagePreview('${m.name.replace(/'/g, "\\'")}', '${m.desc.replace(/'/g, "\\'")}', '${m.img}')">
                  <img src="${m.img}" alt="${m.name}" class="moon-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'44\\' height=\\'44\\'><circle cx=\\'22\\' cy=\\'22\\' r=\\'20\\' fill=\\'%23475569\\'/></svg>'">
                  <div class="moon-info">
                    <h4>${m.name}</h4>
                    <span>${m.desc}</span>
                  </div>
                </div>
              `).join('')}
            </div>
            ${p.moonsCount > p.moons.length ? `
              <p style="font-size: 0.72rem; color: var(--text-muted); margin-top: 10px; font-style: italic;">
                * Οι υπόλοιποι ${p.moonsCount - p.moons.length} δορυφόροι είναι μικρά ακανόνιστα θραύσματα πάγου (2-5 χλμ) χωρίς φωτογραφική χαρτογράφηση.
              </p>
            ` : ''}
          </div>
        `;
      } else {
        moonsHtml = `
          <div class="moons-dropdown" id="dropdown-${idx}">
            <p style="font-size: 0.82rem; color: var(--text-muted); padding: 4px 0;">Δεν διαθέτει φυσικούς δορυφόρους.</p>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="planet-main-row">
          <div class="planet-left">
            <img src="${p.img}" alt="${p.name}" class="planet-avatar-img" onclick="event.stopPropagation(); openImagePreview('${p.name.replace(/'/g, "\\'")}', '${p.type} • Απόσταση: ${p.distSun}', '${p.img}')" />
            <div class="planet-meta">
              <h3>${p.name}</h3>
              <p>${p.type} • Απόσταση: ${p.distSun}</p>
            </div>
          </div>
          <div class="moons-badge">
            ${p.moonsCount} ${p.moonsCount === 1 ? 'Δορυφόρος' : 'Δορυφόροι'}
          </div>
        </div>
        ${moonsHtml}
      `;

      card.addEventListener('click', () => {
        const drop = document.getElementById(`dropdown-${idx}`);
        drop.classList.toggle('open');
      });

      listEl.appendChild(card);
    });
  </script>
</body>
</html>
