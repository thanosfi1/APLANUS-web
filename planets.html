<!DOCTYPE html>
<html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070913"><title>APLANUS | Πλανήτες</title>
<style>
:root{--bg:#050912;--panel:#08111d;--line:#1b3143;--text:#eef6ff;--muted:#8fa5b7;--cyan:#79cfff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 55% -20%,#102238 0,#050912 42%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}.app{max-width:1250px;margin:auto;padding:20px}.top{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);padding-bottom:16px}.back{color:var(--cyan);text-decoration:none;border:1px solid var(--line);padding:9px 12px;border-radius:10px}.brand{font-size:clamp(1.6rem,5vw,2.5rem);letter-spacing:.18em;font-weight:300}.hero{padding:28px 0 16px}.hero h1{font-size:clamp(1.7rem,5vw,2.6rem);margin:0 0 8px}.hero p{color:var(--muted);margin:0}.system{display:flex;align-items:flex-end;gap:18px;overflow-x:auto;padding:30px 12px 22px;margin:20px 0;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(10,22,36,.75),rgba(4,9,16,.9));scrollbar-width:thin}.system-item{min-width:92px;text-align:center;color:#dbeafe;font-size:.78rem}.system-item .orb{margin:auto auto 10px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:16px;background:rgba(7,16,27,.88);padding:16px;min-width:0}.card h2{font-size:1rem;margin:12px 0 5px}.meta{color:var(--muted);font-size:.78rem;line-height:1.55}.planet-visual{height:135px;display:flex;align-items:center;justify-content:center}.orb{width:92px;height:92px;border-radius:50%;position:relative;box-shadow:inset -20px -12px 28px rgba(0,0,0,.48),0 0 20px rgba(130,190,255,.12)}.mercury{background:radial-gradient(circle at 35% 30%,#ddd0bc,#8d8173 48%,#554d47)}.venus{background:repeating-linear-gradient(8deg,#e6c77c 0 9px,#c9964e 10px 17px,#f0d99a 18px 25px)}.earth{background:radial-gradient(ellipse at 34% 40%,#64a66a 0 13%,transparent 14%),radial-gradient(ellipse at 63% 60%,#77aa66 0 11%,transparent 12%),radial-gradient(circle at 40% 35%,#4db4df,#1765a0 65%,#0d365c)}.mars{background:radial-gradient(circle at 40% 35%,#dc7650,#9f4029 65%,#60271f)}.jupiter{width:118px;height:118px;background:repeating-linear-gradient(0deg,#c79b6b 0 10px,#f0d0a3 11px 20px,#a76c4e 21px 27px,#e2b985 28px 37px)}.jupiter:after{content:"";position:absolute;width:25px;height:12px;border-radius:50%;background:#a54b34;right:13px;top:65px}.saturn{background:repeating-linear-gradient(0deg,#cbb77e 0 9px,#ead7a0 10px 18px)}.saturn:after{content:"";position:absolute;width:145px;height:38px;border:8px double #a99466;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);z-index:-1}.uranus{background:radial-gradient(circle at 35% 30%,#9de8ea,#50bfc9 65%,#2b7783)}.neptune{background:repeating-linear-gradient(0deg,#2150c5 0 13px,#286cdd 14px 26px,#173b9c 27px 35px)}.ceres{background:radial-gradient(circle at 34% 28%,#c8c2b8,#77736c 58%,#45423f)}.pluto{background:radial-gradient(circle at 62% 38%,#d8b99c 0 13%,transparent 14%),radial-gradient(circle at 35% 30%,#d6c3ae,#9a765f 60%,#654b40)}.haumea{width:112px;height:70px;border-radius:50%;background:radial-gradient(ellipse at 35% 30%,#e9e4dc,#aaa39a 65%,#68645f)}.makemake{background:radial-gradient(circle at 35% 30%,#c98b68,#87523d 62%,#503226)}.eris{background:radial-gradient(circle at 35% 30%,#e5e4df,#a8a8a2 60%,#676963)}.section-title{grid-column:1/-1;margin:18px 0 0;font-size:1.25rem}.dwarf-note{grid-column:1/-1;color:var(--muted);font-size:.8rem;margin:-4px 0 2px}.moon{width:34px;height:34px;background:radial-gradient(circle at 35% 30%,#d3d0c9,#827e77)}.tiny{width:28px;height:28px}.moons{display:flex;gap:9px;overflow-x:auto;padding-top:12px;margin-top:12px;border-top:1px solid #14283a}.moon-chip{min-width:54px;text-align:center;color:var(--muted);font-size:.64rem}.moon-chip .orb{margin:0 auto 5px}.note{margin:16px 0;border:1px solid var(--line);border-radius:14px;padding:15px;color:var(--muted);font-size:.82rem}.note strong{color:var(--text)}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:14px}.cards{grid-template-columns:1fr}.system{gap:10px}.system-item{min-width:75px}.planet-visual{height:120px}}
</style></head><body><main class="app"><header class="top"><a class="back" href="index.html">←</a><div class="brand">APLANUS</div></header><section class="hero"><h1>Οι Πλανήτες του Ηλιακού Συστήματος</h1><p>Από τον κοντινότερο στον Ήλιο έως τον πιο μακρινό.</p></section><section class="system" id="system"></section><section class="cards" id="cards"></section><div class="note"><strong>Σειρά από τον Ήλιο</strong><br>Ερμής, Αφροδίτη, Γη, Άρης, Δίας, Κρόνος, Ουρανός, Ποσειδώνας.</div></main>
<script>
const P=[
{name:"Ερμής",en:"Mercury",type:"Βραχώδης πλανήτης",dist:"57,9 εκ. χλμ",cls:"mercury",moonCount:0,moons:[]},
{name:"Αφροδίτη",en:"Venus",type:"Βραχώδης πλανήτης",dist:"108,2 εκ. χλμ",cls:"venus",moonCount:0,moons:[]},
{name:"Γη",en:"Earth",type:"Βραχώδης πλανήτης",dist:"149,6 εκ. χλμ",cls:"earth",moonCount:1,moons:["Σελήνη"]},
{name:"Άρης",en:"Mars",type:"Βραχώδης πλανήτης",dist:"227,9 εκ. χλμ",cls:"mars",moonCount:2,moons:["Φόβος","Δείμος"]},
{name:"Δίας",en:"Jupiter",type:"Αέριος γίγαντας",dist:"778,5 εκ. χλμ",cls:"jupiter",moonCount:115,moons:["Ιώ","Ευρώπη","Γανυμήδης","Καλλιστώ"]},
{name:"Κρόνος",en:"Saturn",type:"Αέριος γίγαντας",dist:"1,43 δισ. χλμ",cls:"saturn",moonCount:293,moons:["Τιτάνας","Ρέα","Ιαπετός","Διώνη"]},
{name:"Ουρανός",en:"Uranus",type:"Γίγαντας πάγου",dist:"2,87 δισ. χλμ",cls:"uranus",moonCount:29,moons:["Τιτάνια","Όμπερον","Άριελ","Ουμβριήλ"]},
{name:"Ποσειδώνας",en:"Neptune",type:"Γίγαντας πάγου",dist:"4,50 δισ. χλμ",cls:"neptune",moonCount:16,moons:["Τρίτωνας","Νηρηίδα","Πρωτέας","Λάρισσα"]}
];
const D=[
{name:"Δήμητρα",en:"Ceres",type:"Νάνος πλανήτης · Ζώνη Αστεροειδών",dist:"413,7 εκ. χλμ",cls:"ceres",moonCount:0,moons:[]},
{name:"Πλούτωνας",en:"Pluto",type:"Νάνος πλανήτης · Ζώνη Kuiper",dist:"5,9 δισ. χλμ",cls:"pluto",moonCount:5,moons:["Χάρων","Νύχτα","Ύδρα","Κέρβερος","Στύγα"]},
{name:"Χαουμέα",en:"Haumea",type:"Νάνος πλανήτης · Ζώνη Kuiper",dist:"~6,5 δισ. χλμ",cls:"haumea",moonCount:2,moons:["Hiʻiaka","Namaka"]},
{name:"Μακεμάκε",en:"Makemake",type:"Νάνος πλανήτης · Ζώνη Kuiper",dist:"~6,9 δισ. χλμ",cls:"makemake",moonCount:1,moons:["MK 2"]},
{name:"Έρις",en:"Eris",type:"Νάνος πλανήτης · Διασκορπισμένος δίσκος",dist:"~10,1 δισ. χλμ",cls:"eris",moonCount:1,moons:["Δυσνομία"]}
];
const DIAM={"mercury":4879,"venus":12104,"earth":12756,"mars":6792,"jupiter":142984,"saturn":120536,"uranus":51118,"neptune":49528};
const scaleSize=cls=>Math.max(10,Math.round(DIAM[cls]/142984*118));
const sizeStyle=p=>DIAM[p.cls]?`style="width:${scaleSize(p.cls)}px;height:${scaleSize(p.cls)}px"`:"";
const system=document.querySelector("#system"),cards=document.querySelector("#cards");
function card(p){
 const moons=p.moons.length?'<div class="moons">'+p.moons.map(m=>'<div class="moon-chip"><div class="orb moon tiny"></div>'+m+'</div>').join("")+'</div>':"";
 cards.insertAdjacentHTML("beforeend",'<article class="card"><div class="planet-visual"><div class="orb '+p.cls+'"></div></div><h2>'+p.name+' <span class="meta">('+p.en+')</span></h2><div class="meta">'+p.type+'<br>Μέση απόσταση από Ήλιο: '+p.dist+'<br>Φυσικοί δορυφόροι: <strong style="color:#eef6ff">'+p.moonCount+'</strong></div>'+moons+'</article>');
}
P.forEach(p=>{system.insertAdjacentHTML("beforeend",'<div class="system-item"><div class="orb '+p.cls+'" '+sizeStyle(p)+'></div><b>'+p.name+'</b></div>');card(p)});
cards.insertAdjacentHTML("beforeend",'<h2 class="section-title">Νάνοι Πλανήτες</h2><p class="dwarf-note">Οι πέντε επίσημα αναγνωρισμένοι νάνοι πλανήτες του Ηλιακού Συστήματος.</p>');
D.forEach(card);
</script></body></html>
