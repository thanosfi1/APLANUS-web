<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070913"><title>APLANUS | Παρατήρηση</title><style>:root{--bg:#070913;--card:#0f172ad9;--cyan:#38bdf8;--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(circle at top,#172554,#070913 45%);color:#f8fafc;font-family:Inter,system-ui}.wrap{max-width:900px;margin:auto}.top{display:flex;align-items:center;gap:18px;border-bottom:1px solid #24364b;padding-bottom:16px}.back{color:var(--cyan);text-decoration:none;border:1px solid #334155;border-radius:12px;padding:9px 12px}.brand{letter-spacing:.18em;font-size:1.3rem}h1{font-size:clamp(1.8rem,6vw,2.7rem);margin:28px 0 6px}.sub{color:var(--muted);margin:0 0 22px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.controls select,.controls input,.controls button{background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:10px}.panel{background:linear-gradient(135deg,rgba(16,23,42,.9),rgba(15,23,42,.6));border:1px solid var(--cyan);border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;box-shadow:0 10px 25px #0004}.toprow{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}.gauge{width:84px;height:84px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--cyan);box-shadow:0 0 20px #38bdf84d;background:#0f172ad9}.score{font-size:1.4rem;font-weight:800}.pill{font-size:.78rem;padding:5px 12px;border-radius:20px;font-weight:700;margin-top:5px;display:inline-block}.desc{color:var(--muted);line-height:1.5;max-width:680px}.hint{margin-top:16px;color:#64748b;font-size:.78rem;text-align:center}</style></head><body><main class="wrap"><header class="top"><a class="back" href="index.html">←</a><div class="brand">APLANUS</div></header><h1>Παρατήρηση</h1><p class="sub">Καταλληλότητα ουρανού για τηλεσκόπιο.</p><div class="controls"><select id="city"><option value="37.9838,23.7275">Αθήνα</option><option value="40.6401,22.9444" selected>Θεσσαλονίκη</option><option value="40.9376,24.4071">Καβάλα</option><option value="35.3387,25.1442">Ηράκλειο</option><option value="39.6243,19.9217">Κέρκυρα</option><option value="36.4432,28.2258">Ρόδος</option></select><input id="date" type="date"><input id="time" type="time"><button id="now">Τώρα</button></div><section class="panel"><div class="toprow"><div class="gauge"><span class="score" id="score">--</span><small>/100</small></div><div><h3>Καταλληλότητα Ουρανού για Τηλεσκόπιο</h3><div class="pill" id="pill">Ανάλυση...</div></div></div><p class="desc" id="desc">Υπολογισμός συνθηκών...</p></section><p class="hint">Η αξιολόγηση βασίζεται στο ύψος του Ήλιου και στον φωτισμό/θέση της Σελήνης, όπως στην αρχική εφαρμογή.</p></main><script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script><script>
const city=document.querySelector("#city"),date=document.querySelector("#date"),time=document.querySelector("#time"),score=document.querySelector("#score"),pill=document.querySelector("#pill"),desc=document.querySelector("#desc");
function setNow(){const n=new Date(),z=n.getTimezoneOffset()*60000,l=new Date(n-z).toISOString();date.value=l.slice(0,10);time.value=l.slice(11,16);calc()}
function calc(){if(!date.value||!time.value)return;const [lat,lon]=city.value.split(",").map(Number),d=new Date(date.value+"T"+time.value+":00"),o=new Astronomy.Observer(lat,lon,0),sun=Astronomy.Horizon(d,o,Astronomy.Equator("Sun",d,o,true,true).ra,Astronomy.Equator("Sun",d,o,true,true).dec,"normal"),moon=Astronomy.Horizon(d,o,Astronomy.Equator("Moon",d,o,true,true).ra,Astronomy.Equator("Moon",d,o,true,true).dec,"normal"),illum=Astronomy.Illumination("Moon",d).phase_fraction;let n=100;const night=sun.altitude<-12,up=moon.altitude>0,p=Math.round(illum*100);if(!night){n=15;pill.textContent="Ημέρα / Λυκόφως";pill.style.cssText="background:#f59e0b26;color:#fbbf24;border:1px solid #f59e0b55";desc.textContent="Ο Ήλιος φωτίζει την ατμόσφαιρα. Η παρατήρηση βαθέως ουρανού είναι αδύνατη. Ορατή μόνο η Σελήνη ή φωτεινοί πλανήτες."}else{n=up?100-Math.round(p*.6):95;if(n>=80){pill.textContent="Εξαιρετικές Συνθήκες (Σκοτεινός Ουρανός)";pill.style.cssText="background:#22c55e26;color:#4ade80;border:1px solid #22c55e55";desc.textContent=up?"Η Σελήνη έχει λίγο φως ("+p+"%). Πολύ καλές συνθήκες για Deep-Sky παρατήρηση.":"Η Σελήνη βρίσκεται κάτω από τον ορίζοντα. Εξαιρετικές συνθήκες για Deep-Sky αντικείμενα και αστροφωτογράφιση."}else if(n>=55){pill.textContent="Καλές / Μέτριες Συνθήκες";pill.style.cssText="background:#38bdf826;color:#38bdf8;border:1px solid #38bdf855";desc.textContent="Η Σελήνη φωτίζει μερικώς ("+p+"%). Κατάλληλο κυρίως για φωτεινούς πλανήτες, διπλά άστρα και φωτεινά αντικείμενα."}else{pill.textContent="Δύσκολες Συνθήκες";pill.style.cssText="background:#ef444426;color:#f87171;border:1px solid #ef444455";desc.textContent="Η φωτεινή Σελήνη ("+p+"%) μειώνει σημαντικά την αντίθεση του ουρανού."}}score.textContent=n}
city.onchange=calc;date.onchange=calc;time.onchange=calc;document.querySelector("#now").onclick=setNow;setNow();
</script></body></html>
