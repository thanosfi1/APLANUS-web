<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>APLANUS | Ραντάρ Στόχευσης</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070913">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #070913;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 16px;
      overflow-x: hidden;
    }

    .top-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-back {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #38bdf8;
      padding: 8px 14px;
      border-radius: 12px;
      font-family: 'Orbitron', monospace;
      font-size: 0.8rem;
      text-decoration: none;
    }

    .planet-selector {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 8px 12px;
      border-radius: 12px;
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      outline: none;
    }

    .radar-wrapper {
      position: relative;
      width: min(85vw, 320px);
      aspect-ratio: 1 / 1;
      margin: 10px auto 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #radarCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .target-card {
      width: 100%;
      max-width: 440px;
      background: rgba(16, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .target-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .target-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }

    .vis-pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .vis-up {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .vis-down {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-box {
      background: rgba(10, 15, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-val {
      font-family: 'Orbitron', monospace;
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .guide-box {
      background: rgba(56, 189, 248, 0.1);
      border: 1px dashed rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.4;
    }
    .guide-box strong {
      color: #fde047;
    }

    .btn-compass-perm {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border: none;
      color: #fff;
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="btn-back">⬅ Αρχική</a>
    <select id="planetSelect" class="planet-selector">
      <option value="Moon">Σελήνη</option>
      <option value="Venus">Αφροδίτη</option>
      <option value="Jupiter" selected>Δίας</option>
      <option value="Saturn">Κρόνος</option>
      <option value="Mars">Άρης</option>
      <option value="Mercury">Ερμής</option>
      <option value="Uranus">Ουρανός</option>
      <option value="Neptune">Ποσειδώνας</option>
      <option value="Pluto">Πλούτωνας</option>
      <option value="Sun">Ήλιος</option>
    </select>
  </div>

  <div class="radar-wrapper">
    <canvas id="radarCanvas" width="640" height="640"></canvas>
  </div>

  <div class="target-card">
    <div class="target-header">
      <span class="target-title" id="cardTitle">Δίας</span>
      <span class="vis-pill" id="cardVis">Υπολογισμός...</span>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <span class="stat-label">Κατευθυνση (Azimuth)</span>
        <span class="stat-val" id="statAz">--°</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Υψος στον Ουρανο (Alt)</span>
        <span class="stat-val" id="statAlt">--°</span>
      </div>
    </div>

    <div class="guide-box" id="guideBox">
      Υπολογισμός οδηγιών στόχευσης...
    </div>

    <button type="button" class="btn-compass-perm" id="btnPerm">🧭 Ενεργοποίηση Ζωντανής Πυξίδας</button>
  </div>

  <script>
    const OBSERVER = new Astronomy.Observer(40.76, 22.58, 20);

    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');
    const planetSelect = document.getElementById('planetSelect');
    const cardTitle = document.getElementById('cardTitle');
    const cardVis = document.getElementById('cardVis');
    const statAz = document.getElementById('statAz');
    const statAlt = document.getElementById('statAlt');
    const guideBox = document.getElementById('guideBox');
    const btnPerm = document.getElementById('btnPerm');

    let phoneHeading = 0; // Σε μοίρες (0 = Βορράς)
    let currentTarget = { az: 0, alt: 0, isUp: false, name: "Δίας" };

    function getCardinalDirection(deg) {
      const dirs = ['Β', 'ΒΑ', 'Α', 'ΝΑ', 'Ν', 'ΝΔ', 'Δ', 'ΒΔ'];
      const index = Math.round(deg / 45) % 8;
      return dirs[index];
    }

    function updateTarget() {
      const now = new Date();
      const bodyKey = planetSelect.value;
      const body = Astronomy.Body[bodyKey];

      const eq = Astronomy.Equator(body, now, OBSERVER, true, true);
      const hor = Astronomy.Horizon(now, OBSERVER, eq.ra, eq.dec, 'normal');

      currentTarget.az = hor.azimuth;
      currentTarget.alt = hor.altitude;
      currentTarget.isUp = hor.altitude > 0;
      currentTarget.name = planetSelect.options[planetSelect.selectedIndex].text;

      cardTitle.textContent = currentTarget.name;
      statAz.textContent = `${Math.round(currentTarget.az)}° (${getCardinalDirection(currentTarget.az)})`;
      statAlt.textContent = `${currentTarget.alt.toFixed(1)}°`;

      if (currentTarget.isUp) {
        cardVis.className = "vis-pill vis-up";
        cardVis.textContent = "● Ορατός στον ουρανό";
      } else {
        cardVis.className = "vis-pill vis-down";
        cardVis.textContent = "○ Υπό τον ορίζοντα";
      }

      // Οδηγός στόχευσης
      if (currentTarget.isUp) {
        guideBox.innerHTML = `Κοιτάξτε προς τα <strong>${getCardinalDirection(currentTarget.az)}</strong> (${Math.round(currentTarget.az)}°) και σηκώστε το βλέμμα σας <strong>${Math.round(currentTarget.alt)}°</strong> ψηλά από τον ορίζοντα.`;
      } else {
        guideBox.innerHTML = `Το σώμα βρίσκεται <strong>κάτω από τη γη</strong> (${Math.abs(Math.round(currentTarget.alt))}° υπό τον ορίζοντα). Περιμένετε την επόμενη ανατολή του.`;
      }

      drawRadar();
    }

    function drawRadar() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const radius = w * 0.42;

      ctx.clearRect(0, 0, w, h);

      ctx.save();
      ctx.translate(cx, cy);
      // Περιστροφή του ραντάρ ανάλογα με το πού κοιτάζει το κινητό
      ctx.rotate((-phoneHeading * Math.PI) / 180);

      // Βάση ραντάρ
      const bgGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, radius);
      bgGrad.addColorStop(0, '#0f172a');
      bgGrad.addColorStop(1, '#050814');
      ctx.fillStyle = bgGrad;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();

      // Ομόκεντροι κύκλοι
      [0.33, 0.66, 1.0].forEach((fraction) => {
        ctx.beginPath();
        ctx.arc(0, 0, radius * fraction, 0, Math.PI * 2);
        ctx.strokeStyle = fraction === 1.0 ? 'rgba(56, 189, 248, 0.4)' : 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = fraction === 1.0 ? 3 : 1.5;
        ctx.stroke();
      });

      // Σταυρός προσανατολισμού
      ctx.strokeStyle = 'rgba(99, 102, 241, 0.2)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -radius); ctx.lineTo(0, radius);
      ctx.moveTo(-radius, 0); ctx.lineTo(radius, 0);
      ctx.stroke();

      // Σημεία Ορίζοντα
      const cardinals = [
        { label: 'Β', angle: 0, color: '#f43f5e' },
        { label: 'Α', angle: 90, color: '#38bdf8' },
        { label: 'Ν', angle: 180, color: '#cbd5e1' },
        { label: 'Δ', angle: 270, color: '#38bdf8' }
      ];

      ctx.font = 'bold 24px Orbitron';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      cardinals.forEach(c => {
        const rad = (c.angle * Math.PI) / 180;
        const tx = Math.sin(rad) * (radius - 28);
        const ty = -Math.cos(rad) * (radius - 28);
        ctx.fillStyle = c.color;
        ctx.fillText(c.label, tx, ty);
      });

      // Θέση Πλανήτη
      const targetRad = (currentTarget.az * Math.PI) / 180;
      // Αν είναι πάνω απ' τον ορίζοντα, όσο πιο ψηλά είναι τόσο πλησιάζει στο κέντρο (Ζενίθ)
      const altFraction = currentTarget.isUp ? (1 - Math.min(90, currentTarget.alt) / 90) : 1;
      const planetDist = radius * 0.78 * altFraction;

      const px = Math.sin(targetRad) * planetDist;
      const py = -Math.cos(targetRad) * planetDist;

      // Φωτεινός στόχος
      ctx.beginPath();
      ctx.arc(px, py, currentTarget.isUp ? 14 : 9, 0, Math.PI * 2);
      ctx.fillStyle = currentTarget.isUp ? 'rgba(56, 189, 248, 0.35)' : 'rgba(239, 68, 68, 0.2)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(px, py, currentTarget.isUp ? 8 : 5, 0, Math.PI * 2);
      ctx.fillStyle = currentTarget.isUp ? '#38bdf8' : '#f87171';
      ctx.shadowColor = currentTarget.isUp ? '#38bdf8' : 'transparent';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Ετικέτα πλανήτη
      ctx.font = 'bold 16px Inter';
      ctx.fillStyle = '#fff';
      ctx.fillText(currentTarget.name, px, py - 16);

      ctx.restore();

      // Σταθερό βέλος κατεύθυνσης της συσκευής (μπροστά)
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.moveTo(cx, cy - radius - 12);
      ctx.lineTo(cx - 10, cy - radius - 26);
      ctx.lineTo(cx + 10, cy - radius - 26);
      ctx.closePath();
      ctx.fill();
    }

    function handleOrientation(e) {
      if (typeof e.webkitCompassHeading !== "undefined") {
        phoneHeading = e.webkitCompassHeading;
      } else if (e.alpha !== null) {
        phoneHeading = (360 - e.alpha) % 360;
      }
      drawRadar();
    }

    async function enableCompass() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
            btnPerm.style.display = 'none';
          }
        } catch (e) {
          console.warn(e);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation, true);
        btnPerm.style.display = 'none';
      }
    }

    btnPerm.addEventListener('click', enableCompass);
    planetSelect.addEventListener('change', updateTarget);

    updateTarget();
    setInterval(updateTarget, 10000);
  </script>
</body>
</html>
