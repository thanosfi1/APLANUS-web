<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>APLANUS | AR Sky Finder</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070913">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }

    #cameraVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #arCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .ar-ui-top {
      position: fixed;
      top: 18px;
      left: 0;
      width: 100%;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
    }

    .btn-ui {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #38bdf8;
      padding: 8px 12px;
      border-radius: 12px;
      font-family: 'Orbitron', monospace;
      font-size: 0.78rem;
      text-decoration: none;
      cursor: pointer;
    }

    .planet-selector {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 8px 10px;
      border-radius: 12px;
      font-family: 'Orbitron', monospace;
      font-size: 0.82rem;
      outline: none;
    }

    .ar-info-panel {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      padding: 12px 16px;
      z-index: 10;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .target-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .guide-text {
      font-size: 0.88rem;
      color: #f1f5f9;
      font-weight: 600;
    }
    .status-subtext {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 4px;
      font-family: 'Orbitron', monospace;
    }

    /* Modal βαθμονόμησης & έναρξης */
    #startModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 9, 19, 0.95);
      backdrop-filter: blur(20px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .btn-action-main {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 14px 26px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <video id="cameraVideo" playsinline autoplay muted></video>
  <canvas id="arCanvas"></canvas>

  <div class="ar-ui-top">
    <a href="index.html" class="btn-ui">⬅ Πίσω</a>
    <select id="planetSelect" class="planet-selector">
      <option value="Moon">Σελήνη</option>
      <option value="Jupiter" selected>Δίας</option>
      <option value="Saturn">Κρόνος</option>
      <option value="Mars">Άρης</option>
      <option value="Venus">Αφροδίτη</option>
      <option value="Mercury">Ερμής</option>
      <option value="Sun">Ήλιος</option>
    </select>
    <button type="button" class="btn-ui" id="btnCalibrate">🎯 Μηδενισμός</button>
  </div>

  <div class="ar-info-panel">
    <div class="target-title" id="targetName">Στόχος: Δίας</div>
    <div class="guide-text" id="guideText">Προετοιμασία...</div>
    <div class="status-subtext" id="coordsInfo">Στρέψτε την κάμερα</div>
  </div>

  <div id="startModal">
    <h2 style="font-family: 'Orbitron'; font-size: 1.5rem; color: #38bdf8; margin-bottom: 12px;">Βαθμονόμηση AR</h2>
    <p style="color: #cbd5e1; font-size: 0.88rem; max-width: 320px; line-height: 1.6;">
      1. Επιτρέψτε την κάμερα και τους αισθητήρες.<br>
      2. Κρατήστε το κινητό <strong>κάθετα</strong> κοιτώντας προς τον ορίζοντα.<br>
      3. Αν ο στόχος αποκλίνει, πατήστε <strong>«Μηδενισμός»</strong> ενώ σημαδεύετε ένα γνωστό σώμα (π.χ. Σελήνη).
    </p>
    <button type="button" class="btn-action-main" id="btnStartAR">Έναρξη & Βαθμονόμηση</button>
  </div>

  <script>
    const OBSERVER = new Astronomy.Observer(40.76, 22.58, 20);

    const video = document.getElementById('cameraVideo');
    const canvas = document.getElementById('arCanvas');
    const ctx = canvas.getContext('2d');
    const planetSelect = document.getElementById('planetSelect');
    const guideText = document.getElementById('guideText');
    const coordsInfo = document.getElementById('coordsInfo');
    const targetName = document.getElementById('targetName');
    const startModal = document.getElementById('startModal');
    const btnStartAR = document.getElementById('btnStartAR');
    const btnCalibrate = document.getElementById('btnCalibrate');

    let phoneAzimuth = 0;
    let phoneAltitude = 0;
    let headingOffset = 0; // Offset χειροκίνητης βαθμονόμησης

    let currentTarget = { az: 0, alt: 0, isUp: false };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function updateTarget() {
      const now = new Date();
      const body = Astronomy.Body[planetSelect.value];
      const eq = Astronomy.Equator(body, now, OBSERVER, true, true);
      const hor = Astronomy.Horizon(now, OBSERVER, eq.ra, eq.dec, 'normal');

      currentTarget.az = hor.azimuth;
      currentTarget.alt = hor.altitude;
      currentTarget.isUp = hor.altitude > 0;

      targetName.textContent = `Στόχος: ${planetSelect.options[planetSelect.selectedIndex].text}`;
    }

    // Υπολογισμός πραγματικής κατεύθυνσης κάμερας
    function handleOrientation(e) {
      let rawHeading = 0;

      // Στο iOS χρησιμοποιούμε το webkitCompassHeading που είναι η πραγματική μαγνητική πυξίδα
      if (typeof e.webkitCompassHeading !== "undefined") {
        rawHeading = e.webkitCompassHeading;
      } else if (e.alpha !== null) {
        rawHeading = (360 - e.alpha) % 360;
      }

      // Εφαρμογή offset βαθμονόμησης
      phoneAzimuth = (rawHeading + headingOffset + 360) % 360;

      // Ακριβής υπολογισμός ύψους κάμερας (Pitch)
      // Όταν το κινητό είναι όρθιο μπροστά στα μάτια: beta = 90 -> Altitude = 0°
      // Όταν στοχεύει ψηλά στον ουρανό: beta = 0 -> Altitude = 90°
      const b = e.beta !== null ? e.beta : 90;
      phoneAltitude = 90 - b;
    }

    // Κουμπί Βαθμονόμησης: Ευθυγραμμίζει το στόχαστρο με τον τρέχοντα επιλεγμένο στόχο
    btnCalibrate.addEventListener('click', () => {
      let diff = currentTarget.az - phoneAzimuth;
      headingOffset = (headingOffset + diff + 360) % 360;
      alert(`Βαθμονόμηση επιτυχής! Ο ορίζοντας ευθυγραμμίστηκε με ${planetSelect.options[planetSelect.selectedIndex].text}.`);
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Υπολογισμός γωνιακής διαφοράς
      let diffAz = currentTarget.az - phoneAzimuth;
      while (diffAz > 180) diffAz -= 360;
      while (diffAz < -180) diffAz += 360;

      const diffAlt = currentTarget.alt - phoneAltitude;

      // Οπτικό πεδίο κινητού (FoV)
      const fovX = 60;
      const fovY = 80;

      const px = cx + (diffAz / (fovX / 2)) * (canvas.width / 2);
      const py = cy - (diffAlt / (fovY / 2)) * (canvas.height / 2);

      const inScreen = (px >= 20 && px <= canvas.width - 20 && py >= 20 && py <= canvas.height - 20);

      coordsInfo.textContent = `Κάμερα: Az ${Math.round(phoneAzimuth)}°, Alt ${Math.round(phoneAltitude)}° | Στόχος: Az ${Math.round(currentTarget.az)}°, Alt ${Math.round(currentTarget.alt)}°`;

      if (inScreen) {
        // Στόχος στην οθόνη: Σταθερός δακτύλιος
        ctx.beginPath();
        ctx.arc(px, py, 26, 0, Math.PI * 2);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 15;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.font = 'bold 15px Orbitron';
        ctx.fillStyle = '#38bdf8';
        ctx.textAlign = 'center';
        ctx.fillText(planetSelect.options[planetSelect.selectedIndex].text, px, py + 42);

        guideText.textContent = "🎯 ΣΤΟΧΟΣ ΚΛΕΙΔΩΜΕΝΟΣ!";
        guideText.style.color = "#4ade80";
      } else {
        guideText.style.color = "#f1f5f9";
        let instruction = "";

        if (Math.abs(diffAz) > 4) {
          instruction += diffAz > 0 ? `Στρίψτε δεξιά ${Math.round(diffAz)}° ` : `Στρίψτε αριστερά ${Math.round(-diffAz)}° `;
        }
        if (Math.abs(diffAlt) > 4) {
          instruction += diffAlt > 0 ? `| Σηκώστε ${Math.round(diffAlt)}°` : `| Χαμηλώστε ${Math.round(-diffAlt)}°`;
        }

        guideText.textContent = instruction || "Πλησιάζετε...";

        // Σταυρόνημα κέντρου
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, 16, 0, Math.PI * 2);
        ctx.moveTo(cx - 24, cy); ctx.lineTo(cx + 24, cy);
        ctx.moveTo(cx, cy - 24); ctx.lineTo(cx, cy + 24);
        ctx.stroke();
      }

      requestAnimationFrame(draw);
    }

    async function startAR() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res !== 'granted') {
            alert('Απαιτείται άδεια αισθητήρων.');
            return;
          }
        } catch (e) {
          console.warn(e);
        }
      }

      window.addEventListener('deviceorientation', handleOrientation, true);

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: 'environment' } }
        }).catch(() => {
          return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        });

        video.srcObject = stream;
        startModal.style.display = 'none';

        updateTarget();
        setInterval(updateTarget, 4000);
        requestAnimationFrame(draw);
      } catch (err) {
        alert('Σφάλμα κάμερας: ' + (err.message || err));
      }
    }

    btnStartAR.addEventListener('click', startAR);
    planetSelect.addEventListener('change', updateTarget);
  </script>
</body>
</html>
