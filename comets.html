<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070913"><title>APLANUS | Κομήτες</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070913;color:#f8fafc;font-family:Inter,system-ui;overscroll-behavior-y:none}body{padding:18px;background-image:radial-gradient(circle at 18% 24%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 72% 16%,#bae6fd 0 1px,transparent 1.5px),linear-gradient(160deg,#030712,#071426 48%,#020617);background-size:130px 130px,180px 180px,auto}.wrap{max-width:1150px;margin:auto}.top{display:flex;gap:18px;align-items:center;border-bottom:1px solid #24364b;padding-bottom:16px}.back{color:#38bdf8;text-decoration:none;border:1px solid #334155;border-radius:12px;padding:9px 12px}.brand{letter-spacing:.18em}h1{font-size:clamp(1.8rem,6vw,2.8rem);margin:28px 0 6px}.sub{color:#94a3b8;line-height:1.55}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools input,.tools select{background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:11px;padding:11px 13px}.tools input{flex:1;min-width:210px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,#10172ae8,#0f172aaa);border:1px solid #26364c;border-radius:17px;padding:16px}.head{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800}.type{color:#7dd3fc;font-size:.7rem}.art{height:130px;margin:10px 0;background:#050914;border-radius:12px}.art svg,.art img{width:100%;height:100%;object-fit:cover;border-radius:12px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fact{background:#070b16aa;border-radius:10px;padding:9px}.fact span{display:block;color:#94a3b8;font-size:.65rem}.fact b{font-size:.84rem}.approach{margin-top:10px;padding-top:10px;border-top:1px solid #26364c;font-size:.75rem;line-height:1.55}.future{color:#7dd3fc}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><a class="back" href="index.html">←</a><div class="brand">APLANUS</div></header><h1>☄️ Κομήτες</h1><p class="sub">Γνωστοί κομήτες του Ηλιακού Συστήματος με SVG απεικόνιση, βασικά στοιχεία και σημαντικές προσεγγίσεις στη Γη.</p><div class="tools"><input id="q" placeholder="Αναζήτηση κομήτη…"><select id="kind"><option value="">Όλοι</option><option>Περιοδικός</option><option>Μακράς περιόδου</option><option>Διαστρικός</option></select></div><div id="list" class="grid"></div></main><script>const C=[["1P/Halley","Περιοδικός","75.3 έτη","0.586 AU","1986-04-11 · 0.417 AU","2061-07-28 · επόμενο περιήλιο"],["2P/Encke","Περιοδικός","3.30 έτη","0.336 AU","2013-10-17 · 0.478 AU","—"],["55P/Tempel–Tuttle","Περιοδικός","33.2 έτη","0.976 AU","1998-01-17 · 0.356 AU","—"],["67P/Churyumov–Gerasimenko","Περιοδικός","6.44 έτη","1.21 AU","2018-11-13 · 0.446 AU","—"],["109P/Swift–Tuttle","Περιοδικός","133 έτη","0.960 AU","1992-12-12 · 1.16 AU","2126-08-05 · ~0.15 AU"],["12P/Pons–Brooks","Περιοδικός","71.3 έτη","0.781 AU","2024-06-02 · ~1.55 AU","—"],["C/1995 O1 Hale–Bopp","Μακράς περιόδου","~2533 έτη","0.914 AU","1997-03-22 · ~1.315 AU","—"],["C/1996 B2 Hyakutake","Μακράς περιόδου","μακρά","0.230 AU","1996-03-25 · ~0.102 AU","—"],["C/2020 F3 NEOWISE","Μακράς περιόδου","~6800 έτη","0.295 AU","2020-07-23 · ~0.692 AU","—"],["C/2023 A3 Tsuchinshan–ATLAS","Μακράς περιόδου","μακρά","0.391 AU","2024-10-12 · ~0.472 AU","—"],["2I/Borisov","Διαστρικός","υπερβολική","2.006 AU","2019-12-28 · ~1.94 AU","Δεν επιστρέφει"],["C/2025 A6 (Lemmon)","Μακράς περιόδου","~1.3 χιλ. έτη","0.530 AU","2025-10 · κοντινότερη διέλευση","2025-11-08 · περιήλιο"],["103P/Hartley 2","Περιοδικός","6.46 έτη","1.05 AU","2010-10-20 · ~0.121 AU","—"],["19P/Borrelly","Περιοδικός","6.85 έτη","1.35 AU","2001 · επίσκεψη Deep Space 1","—"],["81P/Wild 2","Περιοδικός","6.41 έτη","1.59 AU","2004 · επίσκεψη Stardust","—"],["9P/Tempel 1","Περιοδικός","5.58 έτη","1.54 AU","2005 · επίσκεψη Deep Impact","—"]];function art(i,name){const photos={"1P/Halley":"https://science.nasa.gov/wp-content/uploads/2023/09/halley-comet-jpg.webp","103P/Hartley 2":"https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia13/pia13570/PIA13570.jpg","C/2025 A6 (Lemmon)":"https://assets.science.nasa.gov/dynamicimage/assets/science/astro/universe/internal_resources/785/Finding_Comet_Lemmon.jpg"};if(photos[name])return '<img src="'+photos[name]+'" alt="Πραγματική φωτογραφία '+name+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><svg style="display:none" viewBox="0 0 320 130"><path d="M45 65 C120 25 230 40 315 20 C220 70 120 85 45 65" fill="#7dd3fc" opacity=".35"/><circle cx="38" cy="65" r="17" fill="#bae6fd"/></svg>';return '<svg viewBox="0 0 320 130"><defs><linearGradient id="t'+i+'"><stop stop-color="#dff8ff"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs><path d="M45 65 C120 25 230 40 315 20 C220 70 120 85 45 65" fill="url(#t'+i+')" opacity=".7"/><circle cx="38" cy="65" r="17" fill="#bae6fd"/><circle cx="38" cy="65" r="5" fill="#d6c6a7"/></svg>'}function render(){let q=document.querySelector("#q").value.toLowerCase(),k=document.querySelector("#kind").value,a=C.filter(x=>(!q||x[0].toLowerCase().includes(q))&&(!k||x[1]===k));document.querySelector("#list").innerHTML=a.map((x,i)=>`<article class="card"><div class="head"><div class="name">${x[0]}</div><div class="type">${x[1]}</div></div><div class="art">${art(i,x[0])}</div><div class="facts"><div class="fact"><span>Περίοδος</span><b>${x[2]}</b></div><div class="fact"><span>Περιήλιο</span><b>${x[3]}</b></div></div><div class="approach">Προσέγγιση Γης: <b>${x[4]}</b><div class="future">Επόμενη σημαντική: <b>${x[5]}</b></div></div></article>`).join("")}q.oninput=render;kind.onchange=render;render();</script></body></ht
