<!DOCTYPE html><html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070913"><title>APLANUS | Αστρονομικό Ημερολόγιο</title><style>:root{color-scheme:dark;--c:#38bdf8;--bg:#070913;--card:rgba(15,23,42,.8);--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172554,#070913 45%);color:#f8fafc;font-family:Inter,system-ui;min-height:100vh;padding:18px}.wrap{max-width:900px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between}.back{color:var(--c);text-decoration:none;border:1px solid #334155;border-radius:12px;padding:9px 12px}h1{font-size:clamp(1.7rem,6vw,2.7rem);margin:28px 0 4px}.sub{color:var(--muted);margin:0 0 22px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.filters button{white-space:nowrap;border:1px solid #334155;background:#0f172a;color:#e2e8f0;border-radius:999px;padding:8px 12px}.filters button.active{border-color:var(--c);color:var(--c)}.event{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:16px;margin:10px 0;background:var(--card);border:1px solid rgba(56,189,248,.18);border-radius:18px;backdrop-filter:blur(12px)}.date{font-weight:800;color:var(--c);font-size:.8rem}.event h3{margin:0 0 4px}.event p{margin:5px 0;color:var(--muted);font-size:.88rem;line-height:1.45}.tag{font-size:.68rem;border:1px solid #334155;padding:3px 7px;border-radius:999px}.next{border-color:var(--c);box-shadow:0 0 24px rgba(56,189,248,.12)}.empty{color:var(--muted);padding:30px;text-align:center}</style></head><body><main class="wrap"><div class="top"><a class="back" href="index.html">← Αρχική</a><span>APLANUS</span></div><h1>Αστρονομικό Ημερολόγιο</h1><p class="sub">Τα σημαντικότερα επερχόμενα φαινόμενα του 2026.</p><div class="filters" id="filters"></div><section id="events"></section></main><script type="module">import{ASTRONOMY_EVENTS_2026 as E}from"./js/events-2026.js";const types=["Όλα",...new Set(E.map(x=>x.type))],f=document.querySelector("#filters"),box=document.querySelector("#events");let type="Όλα";const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("el-GR",{day:"2-digit",month:"short"});function draw(){box.innerHTML="";const now=new Date();now.setHours(0,0,0,0);const list=E.filter(x=>type==="Όλα"||x.type===type);let marked=false;for(const x of list){const d=new Date(x.date+"T12:00:00"),future=d>=now,el=document.createElement("article");if(future&&!marked){el.className="event next";marked=true}else el.className="event";el.innerHTML='<div class="date">'+x.icon+" "+fmt(x.date)+'</div><div><h3>'+x.title+'</h3><span class="tag">'+x.type+'</span><p>'+x.desc+'</p></div>';box.appendChild(el)}if(!list.length)box.innerHTML='<div class="empty">Δεν υπάρχουν γεγονότα.</div>'}for(const t of types){const b=document.createElement("button");b.textContent=t;b.className=t==="Όλα"?"active":"";b.onclick=()=>{type=t;[...f.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");draw()};f.appendChild(b)}draw();</script></body></html>
