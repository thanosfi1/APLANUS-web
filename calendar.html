<!DOCTYPE html><html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070913"><title>APLANUS | Αστρονομικό Ημερολόγιο</title><style>:root{color-scheme:dark;--c:#38bdf8;--bg:#070913;--card:rgba(15,23,42,.8);--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172554,#070913 45%);color:#f8fafc;font-family:Inter,system-ui;min-height:100vh;padding:18px}.wrap{max-width:900px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between}.back{color:var(--c);text-decoration:none;border:1px solid #334155;border-radius:12px;padding:9px 12px}h1{font-size:clamp(1.7rem,6vw,2.7rem);margin:28px 0 4px}.sub{color:var(--muted);margin:0 0 22px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.filters button{white-space:nowrap;border:1px solid #334155;background:#0f172a;color:#e2e8f0;border-radius:999px;padding:8px 12px}.filters button.active{border-color:var(--c);color:var(--c)}.event{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:16px;margin:10px 0;background:var(--card);border:1px solid rgba(56,189,248,.18);border-radius:18px;backdrop-filter:blur(12px)}.date{font-weight:800;color:var(--c);font-size:.8rem;display:flex;align-items:center;gap:8px}.event-icon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center}.event-icon svg{width:32px;height:32px;overflow:visible}.planet-blue{fill:#36a9e1}.planet-gold{fill:#d9b56d}.planet-cyan{fill:#72d5e3}.moon-fill{fill:#dbe7f1}.orbit{fill:none;stroke:#7dd3fc;stroke-width:1.5;opacity:.7}.meteor{stroke:#e7f7ff;stroke-width:2;stroke-linecap:round}.season{stroke:#7dd3fc;stroke-width:1.6;fill:none}.event h3{margin:0 0 4px}.event p{margin:5px 0;color:var(--muted);font-size:.88rem;line-height:1.45}.tag{font-size:.68rem;border:1px solid #334155;padding:3px 7px;border-radius:999px}.next{border-color:var(--c);box-shadow:0 0 24px rgba(56,189,248,.12)}.empty{color:var(--muted);padding:30px;text-align:center}</style></head><body><main class="wrap"><div class="top"><a class="back" href="index.html">← Αρχική</a><span>APLANUS</span></div><h1>Αστρονομικό Ημερολόγιο</h1><p class="sub">Τα σημαντικότερα επερχόμενα φαινόμενα του 2026.</p><div class="filters" id="filters"></div><section id="events"></section></main><script type="module">import{ASTRONOMY_EVENTS_2026 as E}from"./js/events-2026.js";const types=["Όλα",...new Set(E.map(x=>x.type))],f=document.querySelector("#filters"),box=document.querySelector("#events");let type="Όλα";const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("el-GR",{day:"2-digit",month:"short"});
function icon(x){
 const t=(x.title+" "+x.type).toLowerCase();
 if(t.includes("ποσειδ"))return '<span class="event-icon"><svg viewBox="0 0 40 40"><circle class="planet-blue" cx="20" cy="20" r="11"/><path class="orbit" d="M4 24c8 7 25 8 32-2"/></svg></span>';
 if(t.includes("ουραν"))return '<span class="event-icon"><svg viewBox="0 0 40 40"><circle class="planet-cyan" cx="20" cy="20" r="11"/><path class="orbit" d="M5 18c8-7 25-7 31 1"/></svg></span>';
 if(t.includes("κρό"))return '<span class="event-icon"><svg viewBox="0 0 40 40"><circle class="planet-gold" cx="20" cy="20" r="9"/><ellipse class="orbit" cx="20" cy="20" rx="17" ry="6" transform="rotate(-18 20 20)"/></svg></span>';
 if(t.includes("πανσέλη")||t.includes("σελήν"))return '<span class="event-icon"><svg viewBox="0 0 40 40"><circle class="moon-fill" cx="20" cy="20" r="12"/><circle cx="15" cy="16" r="2" fill="#9aaabd" opacity=".55"/><circle cx="24" cy="23" r="3" fill="#9aaabd" opacity=".4"/></svg></span>';
 if(t.includes("βροχ")||t.includes("δρακον")||t.includes("ωριων")||t.includes("ταυρ")||t.includes("λεον")||t.includes("διδυμ")||t.includes("ουρσί"))return '<span class="event-icon"><svg viewBox="0 0 40 40"><path class="meteor" d="M7 9l12 12M15 6l10 10M5 18l9 9"/><circle fill="#e7f7ff" cx="21" cy="23" r="2.5"/><circle fill="#e7f7ff" cx="27" cy="18" r="2"/></svg></span>';
 if(t.includes("ισημερ")||t.includes("ηλιοστά"))return '<span class="event-icon"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="7" fill="#ffd45c"/><circle class="season" cx="20" cy="20" r="14"/><path class="season" d="M20 2v7M20 31v7M2 20h7M31 20h7"/></svg></span>';
 return '<span class="event-icon"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="10" fill="#7dd3fc"/><circle class="orbit" cx="20" cy="20" r="16"/></svg></span>';
}function draw(){box.innerHTML="";const now=new Date();now.setHours(0,0,0,0);const list=E.filter(x=>type==="Όλα"||x.type===type);let marked=false;for(const x of list){const d=new Date(x.date+"T12:00:00"),future=d>=now,el=document.createElement("article");if(future&&!marked){el.className="event next";marked=true}else el.className="event";el.innerHTML='<div class="date">'+icon(x)+'<span>'+fmt(x.date)+'</span></div><div><h3>'+x.title+'</h3><span class="tag">'+x.type+'</span><p>'+x.desc+'</p></div>';box.appendChild(el)}if(!list.length)box.innerHTML='<div class="empty">Δεν υπάρχουν γεγονότα.</div>'}for(const t of types){const b=document.createElement("button");b.textContent=t;b.className=t==="Όλα"?"active":"";b.onclick=()=>{type=t;[...f.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");draw()};f.appendChild(b)}draw();</script></body></html>
