<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070913"><title>APLANUS | 88 Αστερισμοί</title><style>:root{--cyan:#38bdf8;--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(circle at top,#172554,#070913 48%);color:#f8fafc;font-family:Inter,system-ui;min-height:100vh}.wrap{max-width:1150px;margin:auto}.top{display:flex;align-items:center;gap:18px;border-bottom:1px solid #24364b;padding-bottom:16px}.back{color:var(--cyan);text-decoration:none;border:1px solid #334155;border-radius:12px;padding:9px 12px}.brand{letter-spacing:.18em;font-size:1.3rem}h1{font-size:clamp(1.8rem,6vw,2.8rem);margin:28px 0 6px}.sub,.status{color:var(--muted);line-height:1.5}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools input,.tools select{background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:11px;padding:11px 13px}.tools input{flex:1;min-width:220px}.count{color:#7dd3fc;font-size:.8rem;margin:8px 0 20px}.constellation{margin:28px 0}.constellation h2{font-size:1.2rem;margin:0 0 12px;color:#e0f2fe}.abbr{color:#64748b;font-size:.72rem;margin-left:7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:linear-gradient(145deg,#10172ae8,#0f172a99);border:1px solid #26364c;border-radius:17px;padding:16px}.card-top{display:flex;justify-content:space-between;gap:8px}.star{font-size:1.05rem;font-weight:800}.designation{color:var(--cyan);font-size:.72rem}.system{font-size:.66rem;padding:4px 7px;border-radius:999px;background:#38bdf817;border:1px solid #38bdf840;color:#7dd3fc;white-space:nowrap}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.stat{background:#070b16aa;border-radius:10px;padding:9px}.stat span{display:block;color:var(--muted);font-size:.64rem}.stat b{font-size:.85rem}.loading{padding:28px;border:1px dashed #334155;border-radius:15px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}.visual{display:flex;align-items:center;gap:14px;margin:14px 0 5px}.star-svg{width:92px;height:92px;flex:0 0 92px}.system-box{flex:1;min-height:76px;border:1px solid #29415d;border-radius:11px;padding:8px}.system-box span{display:block;color:var(--muted);font-size:.65rem;margin-bottom:6px}.mini-system{width:100%;height:44px}.spectral-row{display:flex;align-items:center;gap:8px;margin-top:9px}.spectral-badge{border-radius:999px;padding:4px 9px;font-size:.72rem;font-weight:800;border:1px solid #ffffff25}.color-name{color:#9ecdf8;font-size:.72rem}.constellation h2{display:flex;align-items:center;gap:7px}.rank{width:27px;height:27px;border:1px solid #3b82f6;border-radius:50%;display:inline-grid;place-items:center;font-size:.72rem;margin-right:7px;color:#dbeafe}
</style></head><body><main class="wrap"><header class="top"><a class="back" href="index.html">←</a><div class="brand">APLANUS</div></header><h1>Οι 88 Αστερισμοί</h1><p class="sub">Οι 3 φωτεινότεροι καταγεγραμμένοι αστέρες κάθε επίσημου αστερισμού της IAU, ταξινομημένοι με βάση το φαινόμενο μέγεθος.</p><div class="tools"><input id="q" placeholder="Αναζήτηση αστεριού ή αστερισμού…"><select id="sys"><option value="">Όλα τα συστήματα</option><option value="Μονό">Μονά</option><option value="Πολλαπλό">Πολλαπλά / components</option></select></div><div class="count" id="count">Φόρτωση αστρικού καταλόγου…</div><div id="list"><div class="loading">Γίνεται επεξεργασία του αστρικού καταλόγου HYG…</div></div></main><script>
const CN={And:"Ανδρομέδα",Ant:"Αντλία",Aps:"Πτηνό του Παραδείσου",Aqr:"Υδροχόος",Aql:"Αετός",Ara:"Βωμός",Ari:"Κριός",Aur:"Ηνίοχος",Boo:"Βοώτης",Cae:"Γλυφίς",Cam:"Καμηλοπάρδαλις",Cnc:"Καρκίνος",CVn:"Θηρευτικοί Κύνες",CMa:"Μεγάλος Κύων",CMi:"Μικρός Κύων",Cap:"Αιγόκερως",Car:"Τρόπις",Cas:"Κασσιόπη",Cen:"Κένταυρος",Cep:"Κηφεύς",Cet:"Κήτος",Cha:"Χαμαιλέων",Cir:"Διαβήτης",Col:"Περιστερά",Com:"Κόμη Βερενίκης",CrA:"Νότιος Στέφανος",CrB:"Βόρειος Στέφανος",Crv:"Κόραξ",Crt:"Κρατήρ",Cru:"Νότιος Σταυρός",Cyg:"Κύκνος",Del:"Δελφίν",Dor:"Ξιφίας",Dra:"Δράκων",Equ:"Ιππάριον",Eri:"Ηριδανός",For:"Κάμινος",Gem:"Δίδυμοι",Gru:"Γερανός",Her:"Ηρακλής",Hor:"Ωρολόγιον",Hya:"Ύδρα",Hyi:"Ύδρος",Ind:"Ινδός",Lac:"Σαύρα",Leo:"Λέων",LMi:"Μικρός Λέων",Lep:"Λαγωός",Lib:"Ζυγός",Lup:"Λύκος",Lyn:"Λυγξ",Lyr:"Λύρα",Men:"Τράπεζα",Mic:"Μικροσκόπιον",Mon:"Μονόκερως",Mus:"Μυία",Nor:"Γνώμων",Oct:"Οκτάς",Oph:"Οφιούχος",Ori:"Ωρίων",Pav:"Ταώς",Peg:"Πήγασος",Per:"Περσεύς",Phe:"Φοίνιξ",Pic:"Οκρίβας",Psc:"Ιχθύες",PsA:"Νότιος Ιχθύς",Pup:"Πρύμνα",Pyx:"Πυξίς",Ret:"Δίκτυον",Sge:"Βέλος",Sgr:"Τοξότης",Sco:"Σκορπιός",Scl:"Γλύπτης",Sct:"Ασπίς",Ser:"Όφις",Sex:"Εξάς",Tau:"Ταύρος",Tel:"Τηλεσκόπιον",Tri:"Τρίγωνον",TrA:"Νότιον Τρίγωνον",Tuc:"Τουκάνα",UMa:"Μεγάλη Άρκτος",UMi:"Μικρή Άρκτος",Vel:"Ιστία",Vir:"Παρθένος",Vol:"Ιπτάμενος Ιχθύς",Vul:"Αλώπηξ"};
let DATA=[];
function csvLine(line){const a=[];let x="",q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c=='"'){if(q&&line[i+1]=='"'){x+='"';i++}else q=!q}else if(c==","&&!q){a.push(x);x=""}else x+=c}a.push(x);return a}
function systemOf(r){return (r.comp&&r.comp!="1")||r.comp_primary||r.base?"Πολλαπλό":"Μονό"}
function specInfo(s){const c=(s||"G")[0].toUpperCase(),m={O:["#5b8cff","Μπλε"],B:["#86b7ff","Μπλε-λευκό"],A:["#dbeafe","Λευκό"],F:["#fff1bd","Κίτρινο-λευκό"],G:["#ffd34e","Κίτρινο"],K:["#ff8a2b","Πορτοκαλί"],M:["#ef4937","Κόκκινο"]};return m[c]||["#dbeafe","Λευκό"]}
function starSVG(s){const [c]=specInfo(s);return '<svg class="star-svg" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="g'+Math.random().toString(36).slice(2)+'"><stop offset="0" stop-color="#fff"/><stop offset=".32" stop-color="'+c+'"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></radialGradient></defs><circle cx="50" cy="50" r="47" fill="'+c+'" opacity=".08"/><circle cx="50" cy="50" r="35" fill="'+c+'" opacity=".18"/><circle cx="50" cy="50" r="25" fill="'+c+'"/><circle cx="43" cy="42" r="8" fill="#fff" opacity=".28"/><path d="M50 4v18M50 78v18M4 50h18M78 50h18" stroke="'+c+'" opacity=".35"/></svg>'}
function systemSVG(x){const specs=(x.spect||"").split(/\s*\+\s*/).filter(Boolean),count=x.system==="Μονό"?1:Math.max(2,Math.min(4,specs.length||3));let cs=[];for(let i=0;i<count;i++)cs.push(specInfo(specs[i]||x.spect)[0]);const pos=count===1?[[50,22]]:count===2?[[30,22],[70,22]]:count===3?[[20,25],[50,18],[80,25]]:[[15,25],[38,17],[63,23],[85,17]];return '<svg class="mini-system" viewBox="0 0 100 44">'+(count>1?'<ellipse cx="50" cy="22" rx="43" ry="17" fill="none" stroke="#36516f" stroke-width="1"/>':'')+pos.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i?7:9)+'" fill="'+cs[i]+'" stroke="#fff" stroke-opacity=".25"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i?11:13)+'" fill="'+cs[i]+'" opacity=".12"/>').join("")+'</svg>'}
function render(){const q=document.querySelector("#q").value.toLowerCase(),sy=document.querySelector("#sys").value;let shown=0,out="";for(const code of Object.keys(CN)){let a=DATA.filter(x=>x.con===code&&(!q||(CN[code]+" "+x.name+" "+x.des).toLowerCase().includes(q))&&(!sy||x.system===sy));if(!a.length)continue;shown++;out+='<section class="constellation"><h2>'+CN[code]+'<span class="abbr">'+code+'</span></h2><div class="grid">'+a.map((x,i)=>{const si=specInfo(x.spect);return '<article class="card"><div class="card-top"><div><div class="star"><span class="rank">'+(i+1)+'</span>'+x.name+'</div><div class="designation">'+x.des+'</div></div><span class="system">'+x.system+'</span></div><div class="visual">'+starSVG(x.spect)+'<div class="system-box"><span>Σύστημα · '+x.system+'</span>'+systemSVG(x)+'</div></div><div class="spectral-row"><span class="spectral-badge" style="background:'+si[0]+'22;color:'+si[0]+';border-color:'+si[0]+'55">'+x.spect+'</span><span class="color-name">'+si[1]+'</span></div><div class="stats"><div class="stat"><span>Απόσταση</span><b>'+x.dist+'</b></div><div class="stat"><span>Φαινόμενο μέγεθος</span><b>'+x.mag+'</b></div><div class="stat"><span>Απόλυτο μέγεθος</span><b>'+x.abs+'</b></div><div class="stat"><span>Φασματικός τύπος</span><b>'+x.spect+'</b></div></div></article>'}).join("")+'</div></section>'}document.querySelector("#list").innerHTML=out||'<div class="loading">Δεν βρέθηκαν αποτελέσματα.</div>';document.querySelector("#count").textContent=shown+" από 88 αστερισμούς • "+DATA.length+" φωτεινά άστρα"}
async function load(){try{const r=await fetch("https://raw.githubusercontent.com/astronexus/HYG-Database/main/hyg/CURRENT/hygdata_v41.csv");if(!r.ok)throw 0;const lines=(await r.text()).split(/\r?\n/),h=csvLine(lines.shift()),ix=Object.fromEntries(h.map((x,i)=>[x,i])),g={};for(const line of lines){if(!line)continue;const a=csvLine(line),con=a[ix.con],mag=+a[ix.mag];if(!CN[con]||!Number.isFinite(mag))continue;const r={con,proper:a[ix.proper],bf:a[ix.bf],bayer:a[ix.bayer],flam:a[ix.flam],dist:a[ix.dist],mag,abs:a[ix.absmag],spect:a[ix.spect],comp:a[ix.comp],comp_primary:a[ix.comp_primary],base:a[ix.base]};(g[con]??=[]).push(r)}for(const con of Object.keys(CN)){const rows=(g[con]||[]).sort((a,b)=>a.mag-b.mag).slice(0,3);for(const r of rows){const pc=+r.dist;DATA.push({con,name:r.proper||r.bf||((r.bayer||r.flam||"Άστρο")+" "+con),des:r.bf||((r.bayer||r.flam||"")+" "+con),system:systemOf(r),dist:Number.isFinite(pc)&&pc<100000?(pc*3.26156).toFixed(pc*3.26156<100?1:0)+" έτη φωτός":"—",mag:r.mag.toFixed(2),abs:r.abs!==""?(+r.abs).toFixed(2):"—",spect:r.spect||"—"})}}render()}catch(e){document.querySelector("#count").textContent="Σφάλμα φόρτωσης καταλόγου";document.querySelector("#list").innerHTML='<div class="loading">Δεν ήταν δυνατή η φόρτωση των αστρικών δεδομένων. Δοκίμασε ανανέωση της σελίδας.</div>'}}
q.oninput=render;sys.onchange=render;load();
</script></body></html>
