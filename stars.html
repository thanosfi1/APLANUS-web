<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070913"><title>APLANUS | Αστέρια & Αστερισμοί</title><style>:root{--bg:#070913;--card:#0f172ad9;--cyan:#38bdf8;--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(circle at top,#172554,#070913 48%);color:#f8fafc;font-family:Inter,system-ui}.wrap{max-width:1100px;margin:auto}.top{display:flex;align-items:center;gap:18px;border-bottom:1px solid #24364b;padding-bottom:16px}.back{color:var(--cyan);text-decoration:none;border:1px solid #334155;border-radius:12px;padding:9px 12px}.brand{letter-spacing:.18em;font-size:1.3rem}h1{font-size:clamp(1.8rem,6vw,2.8rem);margin:28px 0 6px}.sub{color:var(--muted);line-height:1.5}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.tools input,.tools select{background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:11px;padding:11px 13px}.tools input{flex:1;min-width:220px}.constellation{margin:26px 0}.constellation h2{font-size:1.25rem;margin:0 0 12px;color:#e0f2fe}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:linear-gradient(145deg,#10172ae8,#0f172a99);border:1px solid #26364c;border-radius:17px;padding:16px;box-shadow:0 8px 22px #0003}.card-top{display:flex;justify-content:space-between;gap:10px}.star{font-size:1.08rem;font-weight:800}.designation{color:var(--cyan);font-size:.72rem}.system{font-size:.7rem;padding:4px 8px;border-radius:999px;background:#38bdf817;border:1px solid #38bdf840;color:#7dd3fc;white-space:nowrap}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.stat{background:#070b16aa;border-radius:10px;padding:9px}.stat span{display:block;color:var(--muted);font-size:.65rem}.stat b{font-size:.88rem}.spectral{margin-top:10px;color:#cbd5e1;font-size:.78rem}.empty{color:var(--muted);padding:20px;border:1px dashed #334155;border-r
